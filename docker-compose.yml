services:
  status-poller:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-status-poller:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    privileged: false
    user: www-data
    env_file: [local.env]

  phpqa:
    image: jakzal/phpqa:php8.5-alpine
    build:
      context: .
      dockerfile: docker/phpqa/Dockerfile

  phpstan:
    image: jakzal/phpqa:php8.5-alpine@sha256:381a7c1379329b95170dc86122dc293698c7e70e10d711acbafd805485ed3faa
    volumes:
      - .:/app
    command:
      - "phpstan"
      - "analyse"
      - "-c"
      - "/app/tests/phpstan.neon"

  lint:
    image: jakzal/phpqa:php8.5-alpine@sha256:381a7c1379329b95170dc86122dc293698c7e70e10d711acbafd805485ed3faa
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    command:
      - phpcs
      - -p
      - --report=checkstyle
      - --standard=PSR12
      - --warning-severity=0
      - /app/src
      - /app/public

  phpmd:
    image: jakzal/phpqa:php8.5-alpine@sha256:381a7c1379329b95170dc86122dc293698c7e70e10d711acbafd805485ed3faa
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    command:
      - phpmd
      - /app/src/NotifyStatusPoller
      - text
      - codesize,unusedcode,naming

  test:
    image: jakzal/phpqa:php8.5-alpine@sha256:381a7c1379329b95170dc86122dc293698c7e70e10d711acbafd805485ed3faa
    volumes:
      - .:/app
    command:
      - "php"
      - "-dpcov.enabled=1"
      - "-dpcov.directory=/app"
      - '-dpcov.exclude="~vendor~"'
      - "/app/vendor/bin/phpunit"
      - "--configuration=/app/tests/phpunit.xml"
      - "--coverage-text"
      - "--log-junit=/app/test-results/unit/results.xml"
      - "--testsuite=unit"

  phpmetrics:
    image: jakzal/phpqa:php8.5-alpine@sha256:381a7c1379329b95170dc86122dc293698c7e70e10d711acbafd805485ed3faa
    volumes:
      - .:/app
    command:
      - "phpmetrics"
      - "--report-html=/app/test-results/phpmetrics"
      - "/app/src/NotifyStatusPoller"

  check-coverage:
    image: jakzal/phpqa:php8.5-alpine@sha256:381a7c1379329b95170dc86122dc293698c7e70e10d711acbafd805485ed3faa
    volumes:
      - .:/app
    command:
      - "php"
      - "-f"
      - "/app/scripts/coverage-checker.php"
      - "/app/test-results/clover/results.xml"
      - "100"

  test-functional:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-status-poller-test:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    depends_on:
      mock-notify:
        condition: service_healthy
      mock-sirius:
        condition: service_healthy
    command:
      - "/var/www/vendor/bin/phpunit"
      - "--configuration=/var/www/tests/phpunit.xml"
      - "--no-coverage"
      - "--log-junit=/var/www/test-results/functional/results.xml"
      - "--testsuite=functional"
    env_file: [local.env]

  mock-notify:
    image: mock-notify:latest
    container_name: mock-notify
    build:
      context: .
      dockerfile: docker/mock-notify/Dockerfile
    command:
      - "mock"
      - "-h"
      - "0.0.0.0"
      - "--multiprocess"
      - "false"
      - "/app/mock-notify/openapi.yml"
    volumes:
      - "./docker/mock-notify:/app/mock-notify"
    ports:
      - "4010:4010"
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  mock-sirius:
    image: mock-sirius:latest
    container_name: mock-sirius
    build:
      context: .
      dockerfile: docker/mock-sirius/Dockerfile
    command:
      - "mock"
      - "-p"
      - "4011"
      - "-h"
      - "0.0.0.0"
      - "--multiprocess"
      - "false"
      - "/app/mock-sirius/openapi.yml"
    volumes:
      - "./docker/mock-sirius:/app/mock-sirius"
    ports:
      - "4011:4011"
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  composer:
    image: composer@sha256:7725eb4545c438629ae8bde3ef0bb9a5038ef566126ad878442a69007242d267
    command: ["install"]
    volumes:
      - ~/.composer:/tmp
      - ./:/app
