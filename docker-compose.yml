services:
  status-poller:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-status-poller:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    privileged: false
    user: www-data
    read_only: true
    env_file: [local.env]

  status-poller-test:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-status-poller:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    privileged: false
    user: www-data
    read_only: true

  mock-notify:
    image: mock-notify:latest
    container_name: mock-notify
    build:
      context: .
      dockerfile: docker/mock-notify/Dockerfile
    command:
      - "mock"
      - "-h"
      - "0.0.0.0"
      - "--multiprocess"
      - "false"
      - "/app/mock-notify/openapi.yml"
    volumes:
      - "./docker/mock-notify:/app/mock-notify"
    ports:
      - "4010:4010"
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  mock-sirius:
    image: mock-sirius:latest
    container_name: mock-sirius
    build:
      context: .
      dockerfile: docker/mock-sirius/Dockerfile
    command:
      - "mock"
      - "-p"
      - "4011"
      - "-h"
      - "0.0.0.0"
      - "--multiprocess"
      - "false"
      - "/app/mock-sirius/openapi.yml"
    volumes:
      - "./docker/mock-sirius:/app/mock-sirius"
    ports:
      - "4011:4011"
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  composer:
    image: composer@sha256:7725eb4545c438629ae8bde3ef0bb9a5038ef566126ad878442a69007242d267
    command: ["install"]
    volumes:
      - ~/.composer:/tmp
      - ./:/app
